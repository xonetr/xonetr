services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATABASE_PATH: /app/backend/data/xonetr.sqlite3
      MEDIA_DIRECTORY: /app/backend/data/media
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - backend-data:/app/backend/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend-data:
  frontend-node-modules:
